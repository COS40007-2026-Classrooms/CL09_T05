name: Train ML Model

on:
  push:
    branches: [ main ]
    paths:
      - 'task2/**'
      - '.github/workflows/train.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: task2

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('task2/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train model
        run: python model.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: model-results
          path: |
            task2/model_results.png
            task2/predictions_vs_actual.png
            task2/residuals_analysis.png
            task2/metrics.txt
            task2/metrics.json
            task2/model_summary.txt
            task2/submission_5.csv
            task2/cnn_regression_model.h5
            task2/data_info.json
            task2/summary_report.txt
          compression-level: 9
          retention-days: 90
          if-no-files-found: ignore
